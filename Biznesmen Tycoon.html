<!DOCTYPE html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Biznesmen Tycoon</title>
<style>

<div id="hud"><div class="pn">💵 <b id="w"></b></div><div class="pn">🏦 <b id="bk"></b></div><div class="pn">📈 <b id="in"></b>/s</div><div class="pn" id="tm"></div></div>

<script>
const $=s=>document.getElementById(s),c=$('c'),x=c.getContext('2d');
let W,H,K,VW;const WORLD=5900,GY=560;

  x.fillStyle='#4a2f1b';x.fillRect(X-13,gy-44,26,44);x.fillStyle='#ffc21a';x.fillRect(X+6,gy-24,4,4);

  if(k=='house'){x.fillStyle='#6b3a2a';x.beginPath();x.moveTo(X-w/2-10,gy-h);x.lineTo(X,gy-h-56);x.lineTo(X+w/2+10,gy-h);x.fill();top-=56}

  if(k=='shop'){for(let j=0;j<9;j++){x.fillStyle=j%2?'#fff':'#d7263d';x.fillRect(X-w/2-5+j*(w+10)/9,gy-64,(w+10)/9,16)}}}

 x.fillStyle='#ffc21a';x.font='bold 30px sans-serif';x.fillText('🏦 BANK',X,gy-214);x.fillStyle='#fff';x.strokeStyle='#000';x.lineWidth=4;x.font='bold 17px sans-serif';x.strokeText('Na koncie: $'+f(S.pool),X,gy-278);x.fillText('Na koncie: $'+f(S.pool),X,gy-278)}
function salon(X){const gy=GY;x.textAlign='center';x.fillStyle='#dfe9f2';x.fillRect(X-120,gy-130,240,130);x.fillStyle=d>.45?'#9fd2ee':'#ffe9a8';x.fillRect(X-104,gy-104,208,100);x.fillStyle='#d7263d';x.fillRect(X-124,gy-142,248,14);
 x.font='54px sans-serif';x.fillText(['🚲','🚗','🏎️','🚙'][S.veh]||'🚙',X,gy-30);x.fillStyle='#fff';x.strokeStyle='#000';x.lineWidth=4;x.font='bold 17px sans-serif';x.strokeText('SALON AUTO',X,gy-152);x.fillText('SALON AUTO',X,gy-152)}
let last=performance.now();
function loop(n){const dt=Math.min((n-last)/1e3,.05);last=n;tm+=dt;
 const L=!!(keys.ArrowLeft||keys.KeyA),R=!!(keys.ArrowRight||keys.KeyD),mv=R-L,sp=230*(keys.ShiftLeft||keys.ShiftRight?1.5:1)*(S.veh?V[S.veh-1][2]:1);
 if(mv){dir=mv;px=Math.max(60,Math.min(WORLD-60,px+mv*sp*dt));ph+=sp*dt*.045}amp+=((mv?1:0)-amp)*Math.min(1,dt*10);
 S.t=(S.t+dt/150)%1;d=(Math.sin((S.t-.25)*6.2832)+1)/2;const g=inc()*dt;S.pool+=g;
 N.forEach(q=>{q.x+=q.v*dt;if(q.x<0)q.x=WORLD;if(q.x>WORLD)q.x=0});FT.forEach(q=>{q.y-=40*dt;q.l-=dt});FT=FT.filter(q=>q.l>0);
 const cx=Math.max(0,Math.min(WORLD-VW,px-VW/2));
 x.setTransform(K,0,0,K,-cx*K,0);

 if(d<.5){x.fillStyle='rgba(255,255,255,'+(1-d*2)+')';for(let j=0;j<70;j++)x.fillRect(cx+hs(j)*VW,hs(j+50)*380,2,2)}
 const su=(S.t-.25)/.5,mu=((S.t+.5)%1-.25)/.5;
 if(su>0&&su<1){x.fillStyle='#ffe27a';x.beginPath();x.arc(cx+su*VW,GY-120-Math.sin(su*Math.PI)*330,38,0,7);x.fill()}
 if(mu>0&&mu<1){x.fillStyle='#eef2ff';x.beginPath();x.arc(cx+mu*VW,GY-120-Math.sin(mu*Math.PI)*330,28,0,7);x.fill()}
 x.fillStyle='rgba(255,255,255,'+(.25+d*.6)+')';for(let j=0;j<9;j++){const cxp=((j*520+tm*14)%(WORLD*.6))+cx*.8-200;x.beginPath();x.ellipse(cxp-cx*.8+cx*.8-cx*.8+cx*.8,60+hs(j)*160,70,22,0,0,7);x.fill()}
 x.fillStyle=mix([22,29,58],[150,175,205],d);for(let j=0;j<70;j++){const w=60+hs(j)*50,h=120+hs(j+7)*230,bx=j*95+cx*.7;if(bx-cx>VW+100||bx-cx<-120)continue;x.fillRect(bx,GY-h,w,h)}
 x.fillStyle=mix([14,40,30],[60,150,80],d);for(let j=0;j<70;j++){const bx=j*86+cx*.35,tx=bx;x.beginPath();x.arc(tx,GY-40-hs(j+3)*20,30+hs(j)*14,0,7);x.fill()}

 x.fillStyle='#e8d36a';for(let j=Math.floor(cx/120);j<(cx+VW)/120+1;j++)x.fillRect(j*120,GY+130,60,6);

 for(let j=Math.floor(cx/300);j<(cx+VW)/300+1;j++){const lx=j*300+150;x.fillStyle='#2b2f38';x.fillRect(lx-3,GY-140,6,150);if(d<.55){const gg=x.createRadialGradient(lx,GY-140,2,lx,GY-140,120);gg.addColorStop(0,'rgba(255,230,140,'+(.7*(1-d))+')');gg.addColorStop(1,'rgba(255,230,140,0)');x.fillStyle=gg;x.fillRect(lx-120,GY-260,240,260)}x.fillStyle='#ffe58a';x.beginPath();x.arc(lx,GY-142,6,0,7);x.fill()}

 O.forEach(o=>{x.fillStyle=o.t=='p'?(S.lv[o.i]?'#ffc21a':'#d7263d'):'#fff';x.beginPath();x.arc(lx+o.x/WORLD*bw,ly,5,0,7);x.fill()});x.fillStyle='#38d26b';x.beginPath();x.moveTo(lx+px/WORLD*bw,ly-9);x.lineTo(lx+px/WORLD*bw-6,ly-18);x.lineTo(lx+px/WORLD*bw+6,ly-18);x.fill();
